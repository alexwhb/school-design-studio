<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Embed host — checks the editor does not leak into its host</title>
    <style>
      /* Stands in for the host app's own reset and design system. If the editor
         leaks, these are the rules that visibly break. */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
      }
      html {
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
        list-style: disc;
      }
      li {
        list-style: disc;
        font-size: 14px;
      }
      button.host {
        background: #0f172a;
        color: white;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 14px;
        cursor: pointer;
      }
      .host-shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      .host-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid #e2e8f0;
        background: white;
      }
      .host-body {
        min-height: 0;
        padding: 16px;
      }
      .editor-frame {
        height: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        background: white;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script type="module" src="/embed-demo/main.tsx"></script>
    <script defer src="/snap.svg-min.js"></script>
  </body>
</html>
