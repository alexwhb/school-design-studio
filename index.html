<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <!-- Fonts a design can use. Bundled so the editor and every export match. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Design Studio — posters, flyers and slides for your school</title>
  </head>

  <body>
    <script>
      // Set the theme class before the first paint. Doing this from the app
      // would mean rendering the light theme and then repainting, which reads
      // as a white flash on a dark screen. Must stay in step with
      // src/common/hooks/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('ds_theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
    <div class="pointer-case" id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="/snap.svg-min.js"></script>
  </body>
</html>
